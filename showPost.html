<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./node_modules/axios/dist/axios.min.js"></script>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<style>
    body{
        background-color: rgb(199, 202, 221);
    }
    #add-new-post{
        width: 50px; height: 50px;
        font-size: 25px;
        color: blanchedalmond;
        border: none;
        box-shadow: (0,0,0,0.4);
        text-align: center; line-height: 0;
        position: fixed; bottom: 2%; right: 2%; 
        z-index: 99;
    }
    .loader {
    --d:22px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    color: #258bb0;
    box-shadow: 
        calc(1*var(--d))      calc(0*var(--d))     0 0,
        calc(0.707*var(--d))  calc(0.707*var(--d)) 0 1px,
        calc(0*var(--d))      calc(1*var(--d))     0 2px,
        calc(-0.707*var(--d)) calc(0.707*var(--d)) 0 3px,
        calc(-1*var(--d))     calc(0*var(--d))     0 4px,
        calc(-0.707*var(--d)) calc(-0.707*var(--d))0 5px,
        calc(0*var(--d))      calc(-1*var(--d))    0 6px;
    animation: l27 1s infinite steps(8);
    }
    @keyframes l27 {
    100% {transform: rotate(1turn)}
    } 
   
</style>
<body>
<!-- ========== ALL MODALS ========== -->
    <!-- LOGIN MODAL -->
     <div class="modal fade" id="nav-login-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Logging in</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                    <div class="mb-3">
                        <label for="username" class="col-form-label">Username:</label>
                        <input type="text" class="form-control" id="username" value="Ab666630">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="col-form-label">Password</label>
                        <input type="password" class="form-control" id="password" value="1234aa"></input>
                    </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" onclick="logInBtn()" class="btn btn-primary">Log In</button>
                </div>
            </div>
        </div>
     </div>
    <!--// LOGIN MODAL //-->
    
    <!-- REGISTER MODAL -->
     <div class="modal fade" id="nav-register-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">New User</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="name" class="col-form-label">Name:</label>
                            <input type="text" class="form-control" id="name" value="Abood">
                        </div>
                        <div class="mb-3">
                            <label for="username-reg" class="col-form-label">Username:</label>
                            <input type="text" class="form-control" id="username-reg">
                        </div>
                        <div class="mb-3">
                            <label for="password-reg" class="col-form-label">Password</label>
                            <input type="password-reg" class="form-control" id="password-reg" value="1234aa"></input>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="col-form-label">Email</label>
                            <input type="email" class="form-control" id="email"></input>
                        </div>
                         <div class="mb-3">
                            <label for="profile-image-register" class="col-form-label">Profile Image</label>
                            <input type="file" class="form-control" id="profile-image-register"></input>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" onclick="registerBtn()" class="btn btn-primary">Register</button>
                </div>
            </div>
        </div>
     </div>
     <!--// REGISTER MODAL //-->

     <!-- Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Sure?</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-footer">
                    <button type="button" id="canceltaionBtn" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmationBtn" onclick="confirmLogOutBtn()" class="btn btn-danger" data-bs-dismiss="modal" >Yes, log out</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="confirmModalDelete" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete the post</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    <input type="hidden" id="postID-delete">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"  data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="confirmModalDelete" onclick="deletePost()" class="btn btn-danger" data-bs-dismiss="modal">Confirme</button>
                </div>
            </div>
        </div>
    </div>
     <!--// Confirmation Modal //-->

     <!--  ADD POSTS MODAL -->
     <div class="modal fade" id="add-post-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content bg-dark" style="color: aliceblue;">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="post-title-message">Create New Post</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="post-title" class="col-form-label">Title</label>
                            <input type="text" class="form-control" id="post-title" value="">
                            <input type="hidden" id="postID-input">
                        </div>
                        <div class="mb-3">
                            <label for="post-body" class="col-form-label">decription:</label>
                            <textarea name="" class="form-control" id="post-body" value=""></textarea>
                        </div>
                        
                        <!-- <div class="mb-3">
                            todo:
                            <label for="sp-tag" class="col-form-label">Sport</label>
                            <input type="radio" value="Sport" id="sp-tag">

                            <label for="eco-tag" class="col-form-label">Econime</label>
                            <input type="radio" value="Econime" id="eco-tag">

                            <label for="entertain-tag" class="col-form-label">Entertainment</label>
                            <input type="radio" value="Entertainment" id="entertain-tag">
                        </div> -->
                        <div class="mb-3">
                            <label for="post-image" class="col-form-label">upload an image:</label>
                            <input type="file" class="form-control" id="post-image"></input>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button id="createEditBtn" type="button" onclick="createPost()" class="btn btn-primary"></button>
                </div>
            </div>
        </div>
     </div>
      <!-- //  ADD POSTS MODAL // -->
<!-- ===========// ALL MODALS // ========== -->

<!-- ======== ALERTS ======= -->
    <div id="alerts-div" class="show fade" style="position: fixed; bottom: 0; right:0; z-index: 999; margin: 5px;" role="alert"></div>
<!-- ========// ALERTS //======= -->

<!-- TIMER -->
    <p id="full-time" style="display: none;"></p>
    <p id="hours" style="display: none;"></p>
    <p id="mins" style="display: none;"></p>
    <p id="sec" style="display: none;"></p>
<!--// TIMER //-->


 <!-- NAV BAR -->
    <div class="container">
        <div class="d-flex justify-content-center">
            <div class="col-12 d-flex justify-content-center">
                <nav class="navbar w-100 navbar-expand-lg shadow pt-3 mb-5 bg-body-tertiary rounded bg-primary-subtle" style="max-width: 700px;">
                    <div class="container-fluid">
                        <a class="navbar-brand" href="https://www.instagram.com/tarmeezz/" target="_blank">Tarmeez</a>
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="navbarNav">
                            <ul class="navbar-nav">
                                <li class="nav-item">
                                    <a class="nav-link active" aria-current="page" style="cursor: pointer;" href="home.html">Home</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" onclick="openProfile()" style="cursor: pointer;">Profile</a>
                                </li>
                            </ul>
                            <div id="login-register-div" class="d-flex justify-content-end w-100">
                                <img src="profile.png" width="40px" height="40px" alt="">
                                <h4>@Ab6666301</h4>
                                <button type="button"  data-bs-toggle="modal"  data-bs-target="#nav-login-modal" class="btn btn-outline-success mx-1">Login</button>
                                <button type="button"  data-bs-toggle="modal" data-bs-target="#nav-register-modal" class="btn btn-outline-success mx-1">Register</button>
                                
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
    <!--// NAV BAR //-->


<!-- CONTAINER OF THE POST -->
    <div id="container-posts" class="container">
        <div id="subContainer-posts" class="d-flex justify-content-center">
            <div id="cards-posts" class="col-11 mt-1">    
            <!-- the details of the post and name of the owner will be filled here later by js -->
            </div>
        </div>
    </div>

    <div id="loader" style="position: fixed; top:0; bottom:0; right:0; left:0; margin: auto; display: flex; justify-content: center; align-items: center; z-index: 9999;">
